<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Türkiye Maç Geri Sayımı</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#101820;
    color:white;
}

.card{
    background:#1f2937;
    border:none;
    border-radius:20px;
}

.count{
    font-size:2rem;
    font-weight:bold;
    color:#38bdf8;
}

footer{
    background:#000;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>

</head>
<body>

<div class="container py-5">

<h1 class="text-center mb-5">
Türkiye Milli Takımı Maç Geri Sayımı
</h1>

<div class="card p-4 text-center">

<h3>Türkiye İlk Maçı</h3>

<p>14 Haziran 2026 - Saat 07:00</p>

<div id="geriSayim" class="count">
Yükleniyor...
</div>

</div>

</div>

<footer>
© 2026 Tüm Hakları Saklıdır |
Bu web sitesi Demir Büyükbeşe tarafından geliştirilmiştir.
Telif hakları kendisine aittir.
</footer>

<script>

const macTarihi = new Date("June 14, 2026 07:00:00").getTime();

function sayac(){

const simdi = new Date().getTime();

const fark = macTarihi - simdi;

if(fark <= 0){
document.getElementById("geriSayim").innerHTML =
"MAÇ BAŞLADI!";
return;
}

const gun =
Math.floor(fark / (1000*60*60*24));

const saat =
Math.floor((fark % (1000*60*60*24)) / (1000*60*60));

const dakika =
Math.floor((fark % (1000*60*60)) / (1000*60));

const saniye =
Math.floor((fark % (1000*60)) / 1000);

document.getElementById("geriSayim").innerHTML =
`${gun} Gün ${saat} Saat ${dakika} Dakika ${saniye} Saniye`;

}

setInterval(sayac,1000);
sayac();

</script>

</body>
</html>
